name: PR Preview

# Publishes the local dev harness (mock ADOS data) for every PR so POs can review
# UI changes at a URL without installing anything. Approval happens on the PR itself.
#
# Requires:
#   secrets.BLOB_CONNECTION_STRING  (already used by release.yml)
#   vars.PREVIEW_BASE_URL           public base URL of the `apps` container,
#                                   e.g. https://<account>.blob.core.windows.net/apps

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_PREFIX: sprint-report-generator-preview/pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Packages
        run: |
          npm i -g corepack@latest
          corepack enable
          pnpm install

      - name: Check Preview Base URL
        env:
          PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
        run: |
          if [[ ! "$PREVIEW_BASE_URL" =~ ^https:// ]]; then
            echo "::error::Repository variable PREVIEW_BASE_URL must be an https:// URL (got '${PREVIEW_BASE_URL}'). Set it under Settings > Secrets and variables > Actions > Variables, e.g. https://<account>.blob.core.windows.net/apps"
            exit 1
          fi

      - name: Build Preview
        run: pnpm run build:preview

      - name: Upload Preview to Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.BLOB_CONNECTION_STRING }}
        run: |
          az storage blob upload-batch \
            --source dist-preview \
            --destination apps \
            --destination-path "$PREVIEW_PREFIX" \
            --overwrite

      - name: Comment Preview Link on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
        with:
          script: |
            const marker = "<!-- pr-preview -->";
            const base = process.env.PREVIEW_BASE_URL.replace(/\/+$/, "");
            const url = `${base}/${process.env.PREVIEW_PREFIX}/index.html`;
            const body = [
              marker,
              "### 👀 PR preview is ready",
              "",
              `**[Open the preview](${url})** for this commit.`,
              "",
              "- Shows the UI with **mock ADOS data**, not a real organisation's sprints.",
              "- Approve or request changes on this PR, as usual.",
              "",
              "---",
              "_Generated by [Claude Code](https://claude.ai/code)_"
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    name: Remove preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete Preview from Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.BLOB_CONNECTION_STRING }}
        run: |
          az storage blob delete-batch \
            --source apps \
            --pattern "${PREVIEW_PREFIX}/*"
