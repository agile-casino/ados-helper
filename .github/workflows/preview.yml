name: PR Preview

# Publishes the local dev harness (mock ADOS data) for every PR so POs can review
# UI changes at a URL without installing anything. Approval happens on the PR itself.
#
# Requires:
#   secrets.BLOB_CONNECTION_STRING  (already used by release.yml). The public base
#                                   URL of the `apps` container is derived from it.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_PREFIX: sprint-report-generator-preview/pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Packages
        run: |
          npm i -g corepack@latest
          corepack enable
          pnpm install

      - name: Resolve Preview Base URL
        # Derived from the same connection string used for the upload, so no
        # separate repository variable is needed. Never prints the secret.
        env:
          CONN: ${{ secrets.BLOB_CONNECTION_STRING }}
        run: |
          field() { printf '%s' "$CONN" | tr ';' '\n' | sed -n "s/^$1=//p"; }
          base=$(field BlobEndpoint | sed 's#/*$##')
          if [ -z "$base" ]; then
            account=$(field AccountName)
            if [ -z "$account" ]; then
              echo "::error::BLOB_CONNECTION_STRING has no AccountName or BlobEndpoint"
              exit 1
            fi
            suffix=$(field EndpointSuffix)
            base="https://${account}.blob.${suffix:-core.windows.net}"
          fi
          echo "PREVIEW_BASE_URL=${base}/apps" >> "$GITHUB_ENV"
          echo "Preview base URL: ${base}/apps"

      - name: Build Preview
        run: pnpm run build:preview

      - name: Upload Preview to Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.BLOB_CONNECTION_STRING }}
        run: |
          az storage blob upload-batch \
            --source dist-preview \
            --destination apps \
            --destination-path "$PREVIEW_PREFIX" \
            --overwrite

      - name: Comment Preview Link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- pr-preview -->";
            const base = process.env.PREVIEW_BASE_URL.replace(/\/+$/, "");
            const url = `${base}/${process.env.PREVIEW_PREFIX}/index.html`;
            const body = [
              marker,
              "### 👀 PR preview is ready",
              "",
              `**[Open the preview](${url})** for this commit.`,
              "",
              "- Shows the UI with **mock ADOS data**, not a real organisation's sprints.",
              "- Approve or request changes on this PR, as usual.",
              "",
              "---",
              "_Generated by [Claude Code](https://claude.ai/code)_"
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    name: Remove preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete Preview from Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.BLOB_CONNECTION_STRING }}
        run: |
          az storage blob delete-batch \
            --source apps \
            --pattern "${PREVIEW_PREFIX}/*"
